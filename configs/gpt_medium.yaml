# ~27M params (upper end of the 10–30M range; n_layer=10 d=512 exceeds ~30M)
_base: configs/default.yaml
model:
  name: gpt
  vocab_size: 16000
  n_layer: 6
  n_head: 8
  n_embd: 512
  n_positions: 256
  dropout: 0.1
  bias: true
  tie_weights: true
train:
  epochs: 8
  batch_size: 16
  grad_accum: 4
  lr: 0.00025
  min_lr: 0.000025
  weight_decay: 0.1
  warmup_steps: 400
  max_steps: null
  grad_clip: 1.0
  amp: true
  save_every_epochs: 1
eval:
  batch_size: 16
  stride: 128
experiment:
  size_name: medium
