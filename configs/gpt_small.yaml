# ~18–22M params (main model, within 10–30M)
_base: configs/default.yaml
model:
  name: gpt
  vocab_size: 16000
  n_layer: 8
  n_head: 6
  n_embd: 384
  n_positions: 256
  dropout: 0.1
  bias: true
  tie_weights: true
train:
  epochs: 8
  batch_size: 24
  grad_accum: 2
  lr: 0.0003
  min_lr: 0.00003
  weight_decay: 0.1
  warmup_steps: 300
  max_steps: null
  grad_clip: 1.0
  amp: true
  save_every_epochs: 1
eval:
  batch_size: 24
  stride: 128
experiment:
  size_name: small
